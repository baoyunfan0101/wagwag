spring:
  application:
    name: wagwag-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/wagwag}
    username: ${DATABASE_USER:wagwag}
    password: ${DATABASE_PASSWORD:wagwag}
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
      connect-timeout: 250ms
      timeout: 250ms
  flyway:
    locations: classpath:db/migration
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  task:
    scheduling:
      pool:
        size: 2
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

app:
  video:
    processing-enabled: ${VIDEO_PROCESSING_ENABLED:true}
    ffmpeg: ${FFMPEG_BIN:ffmpeg}
    media-base-url: ${MEDIA_PUBLIC_BASE_URL:}
  realtime:
    redis-enabled: ${REALTIME_REDIS_ENABLED:false}
  push:
    enabled: ${EXPO_PUSH_ENABLED:false}
    base-url: ${EXPO_PUSH_BASE_URL:https://exp.host/--/api/v2/push}
    access-token: ${EXPO_PUSH_ACCESS_TOKEN:}
  allowed-origins: ${APP_ALLOWED_ORIGINS:http://localhost:8081,http://localhost:19006}
  follow-cache:
    enabled: ${FOLLOW_CACHE_ENABLED:true}
  community-hot-cache:
    enabled: ${COMMUNITY_HOT_CACHE_ENABLED:true}
  storage:
    bucket: ${S3_BUCKET:}
    region: ${AWS_REGION:us-east-1}
    endpoint: ${S3_ENDPOINT:}
    public-base-url: ${S3_PUBLIC_BASE_URL:}
    access-key: ${S3_ACCESS_KEY:}
    secret-key: ${S3_SECRET_KEY:}
