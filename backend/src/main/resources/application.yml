spring:
  application:
    name: wagwag-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/wagwag}
    username: ${DATABASE_USER:wagwag}
    password: ${DATABASE_PASSWORD:wagwag}
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
      connect-timeout: 250ms
      timeout: 250ms
  flyway:
    locations: classpath:db/migration
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

app:
  allowed-origins: ${APP_ALLOWED_ORIGINS:http://localhost:8081,http://localhost:19006}
  follow-cache:
    enabled: ${FOLLOW_CACHE_ENABLED:true}
  storage:
    bucket: ${S3_BUCKET:}
    region: ${AWS_REGION:us-east-1}
    endpoint: ${S3_ENDPOINT:}
    public-base-url: ${S3_PUBLIC_BASE_URL:}
    access-key: ${S3_ACCESS_KEY:}
    secret-key: ${S3_SECRET_KEY:}
