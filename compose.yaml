services:
  postgres:
    image: postgis/postgis:17-3.5
    platform: linux/amd64
    environment:
      POSTGRES_DB: wagwag
      POSTGRES_USER: wagwag
      POSTGRES_PASSWORD: wagwag
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wagwag -d wagwag"]
      interval: 5s
      timeout: 3s
      retries: 10

  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    environment:
      S3_BUCKET: wagwag-avatars
    ports:
      - "8333:8333"
    volumes:
      - seaweedfs_data:/data

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"

volumes:
  postgres_data:
  seaweedfs_data:
