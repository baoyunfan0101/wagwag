services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: wagwag
      POSTGRES_USER: wagwag
      POSTGRES_PASSWORD: wagwag
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wagwag -d wagwag"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: wagwagminio
      MINIO_ROOT_PASSWORD: wagwagsecret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      - minio
    entrypoint:
      - /bin/sh
      - -c
      - |
        until mc alias set local http://minio:9000 wagwagminio wagwagsecret; do sleep 2; done
        mc mb --ignore-existing local/wagwag-avatars
        mc anonymous set download local/wagwag-avatars

volumes:
  postgres_data:
  minio_data:
